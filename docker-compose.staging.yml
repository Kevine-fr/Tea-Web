# Plafonds de ressources : voir CAPACITY.md (depot Infrastructure).
# cpu_shares 512 (contre 1024 en production) : en cas de contention CPU sur le
# VPS, le trafic de production passe avant la staging.
services:
  react_app:
    image: zstin4/tea-web:${IMAGE_TAG}
    container_name: tea-web-staging
    restart: always
    expose:
      - "80"
    mem_limit: 192m
    cpus: 0.5
    cpu_shares: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
    name: web
