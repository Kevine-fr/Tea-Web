# Plafonds de ressources (VPS mutualise 8 vCPU / 24 Go) : voir CAPACITY.md dans
# le depot Infrastructure. Site statique servi par nginx : tres peu de memoire.
services:
  react_app:
    image: zstin4/tea-web:${IMAGE_TAG}
    container_name: tea-web-main
    restart: always
    expose:
      - "80"
    mem_limit: 192m
    cpus: 1
    cpu_shares: 1024
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
    name: web
