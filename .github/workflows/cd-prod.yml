name: Deploy Frontend to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag DockerHub (ex: prod-v1.2.3)"
        required: true

jobs:
  deploy:
    name: Deploy Frontend → OVH VPS (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan n'a rien retourné — VPS_HOST injoignable ou secret vide"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Production VPS
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << EOF
          set -e
          cd "${{ secrets.PATH_DIR_MAIN }}" || { echo "Dossier ${{ secrets.PATH_DIR_MAIN }} introuvable"; exit 1; }

          echo "Mise a jour du code..."
          if [ ! -d .git ]; then
            echo "Pas de dépôt git ici — git reset impossible. Vérifie que le repo est cloné dans ce dossier."
            exit 1
          fi
          git fetch origin --prune
          git reset --hard origin/main

          echo "Generation du .env..."
          cat > .env << 'ENVEOF'
          IMAGE_TAG=${IMAGE_TAG}
          ENVEOF

          echo "Pull image : zstin4/tea-web:${IMAGE_TAG}"
          docker pull zstin4/tea-web:${IMAGE_TAG}

          echo "Demarrage du container..."
          IMAGE_TAG=${IMAGE_TAG} docker compose -p tea-web-main -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

          timeout 30 bash -c 'until docker ps | grep -q tea-web; do sleep 2; done' \
            || { echo "Container React non demarre"; exit 1; }

          docker image prune -f
          echo "Frontend prod deploye : zstin4/tea-web:${IMAGE_TAG}"
          EOF

      - name: Resume
        run: |
          echo "## Production frontend deployee" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.event.inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY